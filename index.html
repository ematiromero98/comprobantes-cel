<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Comprobantes de pago</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e2e8f0}
header{position:sticky;top:0;background:#1e293b;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:5}
h1{margin:0 0 8px;font-size:16px}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{flex:1;padding:8px 3px;border:1px solid #334155;background:#0f172a;color:#94a3b8;border-radius:8px;font-size:12.5px;font-weight:bold;line-height:1.15}
.tab.active{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.chips{display:flex;gap:6px;margin-top:8px}
.chip{flex:1;padding:7px 4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;border-radius:20px;font-size:12.5px;font-weight:bold}
.chip.active{background:#334155;color:#fff;border-color:#64748b}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
#empresa,#periodo,#busca{padding:9px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:15px}
#empresa,#periodo{flex:1 1 40%;min-width:0}
#busca{flex:1 1 100%;min-width:0}
.wrap{padding:12px 14px 40px}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:10px}
.card:active{background:#243247}
.row{display:flex;justify-content:space-between;align-items:center}
.prov{font-size:15px;margin-top:2px}
.meta{color:#94a3b8;font-size:12px;margin-top:2px}
.saldo{color:#38bdf8;font-weight:bold;margin-top:6px}
.tag{font-size:11px;background:#334155;color:#cbd5e1;border-radius:20px;padding:1px 7px;font-weight:normal;margin-left:4px}
.badge{background:#334155;color:#cbd5e1;border-radius:20px;padding:2px 8px;font-size:12px}
.muted{color:#94a3b8;text-align:center;margin-top:20px}
.err{color:#f87171;text-align:center;margin-top:20px}
#detalle{display:none;position:fixed;inset:0;background:#0f172a;z-index:10;flex-direction:column}
#detalle .top{background:#1e293b;padding:12px 14px;display:flex;align-items:center;gap:10px}
#detalle .body{padding:16px;overflow:auto;flex:1}
#t-orden{font-weight:bold}
.back{background:none;border:none;color:#38bdf8;font-size:22px}
label.cam{display:block;text-align:center;background:#334155;border:2px dashed #475569;border-radius:12px;padding:34px 12px;font-size:16px;margin-bottom:14px}
/* Oculto pero RENDERIZADO: con display:none, iOS Safari no dispara el selector
   de archivo al tocar el label (hay que tocar varias veces). Así se abre al toque. */
#file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
#preview{max-width:100%;border-radius:10px;display:none;margin-bottom:14px}
button.big{width:100%;padding:15px;border:none;border-radius:10px;font-size:17px;font-weight:bold;background:#0ea5e9;color:#fff}
button.big:disabled{background:#475569;color:#94a3b8}
/* Bloque "Documentos" dentro del detalle: lista de archivos guardados. */
.doc-h{font-size:13px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin:2px 0 8px}
.doc{display:flex;align-items:center;gap:10px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.doc:active{background:#243247}
.doc .ic{font-size:20px}
.doc .nm{flex:1;font-size:14px;line-height:1.2}
.doc .go{color:#38bdf8;font-size:18px}
.sep{border:none;border-top:1px solid #334155;margin:18px 0 14px}
/* Visor a pantalla completa (imagen o PDF). */
#visor{display:none;position:fixed;inset:0;background:#0b1220;z-index:40;flex-direction:column}
#visor .top{background:#1e293b;padding:10px 12px;display:flex;align-items:center;gap:10px}
#visor .top .nm{flex:1;font-size:14px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#visor .top a{color:#38bdf8;font-size:13px;text-decoration:none;white-space:nowrap}
#visor .cont{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
#visor img{max-width:100%;height:auto;display:block}
#visor iframe{width:100%;height:100%;border:none;background:#fff}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#334155;color:#fff;padding:12px 18px;border-radius:24px;font-size:15px;opacity:0;transition:.25s;z-index:20}
#toast.show{opacity:1}
#pin-screen{display:none;position:fixed;inset:0;background:#0f172a;z-index:30;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#pin-input{width:100%;max-width:260px;padding:12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:20px;text-align:center;letter-spacing:2px}
</style>
</head>
<body>

<div id="pin-screen">
  <h1>Comprobantes de pago</h1>
  <p class="muted">Ingresá el PIN (solo la primera vez)</p>
  <input id="pin-input" type="password" inputmode="text" placeholder="PIN" onkeydown="if(event.key==='Enter')guardarPin()">
  <p id="pin-err" class="err" style="display:none">PIN incorrecto</p>
  <button class="big" style="max-width:260px;margin-top:16px" onclick="guardarPin()">Entrar</button>
</div>

<header>
  <h1>Comprobantes de pago</h1>
  <div class="tabs">
    <button id="tab-pend" class="tab active" onclick="setTab('PENDIENTE')">Pendientes</button>
    <button id="tab-pag" class="tab" onclick="setTab('PAGADA')">Pagadas</button>
    <button id="tab-ddjj" class="tab" onclick="setTab('DDJJ')">Agente Recaud.</button>
    <button id="tab-ddjjp" class="tab" onclick="setTab('DDJJP')">DDJJ</button>
  </div>
  <div class="filtros">
    <select id="empresa" onchange="render()"><option value="">Todas</option></select>
    <select id="periodo" onchange="render()" style="display:none"><option value="">Todos</option></select>
    <input id="busca" placeholder="Buscar N° / proveedor…" oninput="render()">
  </div>
  <div id="estadofiltro" class="chips" style="display:none">
    <button class="chip active" data-e="pend" onclick="setEstadoFisc('pend')">📎 Pendientes</button>
    <button class="chip" data-e="con" onclick="setEstadoFisc('con')">✓ Cargadas</button>
    <button class="chip" data-e="todas" onclick="setEstadoFisc('todas')">Todas</button>
  </div>
</header>
<div class="wrap"><div id="lista"><p class="muted">Cargando…</p></div></div>

<div id="detalle">
  <div class="top"><button class="back" onclick="volver()">←</button><span id="t-orden"></span></div>
  <div class="body">
    <div id="docs-wrap" style="display:none">
      <div class="doc-h">Documentos</div>
      <div id="docs"><p class="muted" style="margin-top:0">Cargando documentos…</p></div>
    </div>
    <div id="subir-wrap">
      <hr class="sep" id="sep-subir" style="display:none">
      <label class="cam" for="file">📷  Sacar foto  ·  🖼️ elegir de galería</label>
      <input id="file" type="file" accept="image/*">
      <img id="preview">
      <button class="big" id="btnsubir" disabled onclick="subir()">Subir foto</button>
    </div>
  </div>
</div>

<div id="visor">
  <div class="top">
    <button class="back" onclick="cerrarVisor()">←</button>
    <span class="nm" id="v-nombre"></span>
    <a id="v-abrir" href="#" target="_blank" rel="noopener">Abrir en pestaña ↗</a>
  </div>
  <div class="cont" id="v-cont"></div>
</div>
<div id="toast"></div>

<script>
var API = "https://zpwccecovhjmeibxafkg.supabase.co/functions/v1/comprobantes-cel";
var PINKEY = "pin_comprobantes";
var tab = 'PENDIENTE';
var estadoFisc = 'pend';                 // filtro de las solapas DDJJ: pend|con|todas
var ordenes = [], sel = null, imgData = null;
function pin(){ return localStorage.getItem(PINKEY) || ''; }
function money(n){ return '$ ' + Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function show(id){ document.getElementById('detalle').style.display = (id==='detalle')?'flex':'none'; }
function volver(){ show('lista'); }
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.className='show'; setTimeout(function(){e.className='';},2200); }

function mostrarPin(err){
  document.getElementById('pin-err').style.display = err?'block':'none';
  var s=document.getElementById('pin-screen'); s.style.display='flex';
  var i=document.getElementById('pin-input'); i.value=''; i.focus();
}
function guardarPin(){
  var v=document.getElementById('pin-input').value.trim();
  if(!v) return;
  localStorage.setItem(PINKEY, v);
  document.getElementById('pin-screen').style.display='none';
  cargar();
}
function no401(r){
  if(r.status===401){ localStorage.removeItem(PINKEY); mostrarPin(true); throw 'pin'; }
  return r;
}
// fetch con timeout + reintentos: las redes de celular tienen micro-cortes y la
// Edge Function puede tener cold-start. Sin esto, un solo blip dejaba la pantalla
// clavada en "No se pudo cargar" sin recuperarse. Cada intento usa su propio
// AbortController (un signal ya abortado no se puede reusar).
function fetchJSON(url, opts, intentos, ms){
  opts = opts || {};
  intentos = (intentos==null) ? 2 : intentos;
  ms = ms || 20000;                          // subir fotos en redes lentas tarda
  function attempt(n){
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, ms);
    var o = {}; for(var k in opts){ if(k!=='signal') o[k]=opts[k]; }
    o.signal = ctrl.signal;
    return fetch(url, o)
      .then(function(r){ clearTimeout(t); return r; })
      .catch(function(err){
        clearTimeout(t);
        if(n>0){ return new Promise(function(res){ setTimeout(res,1200); }).then(function(){ return attempt(n-1); }); }
        throw err;
      });
  }
  return attempt(intentos);
}

function periodoTxt(p){ p=String(p||''); return p.length>=6 ? (p.slice(4,6)+'/'+p.slice(0,4)) : p; }
function impTxt(i){ i=String(i||''); return i==='ANTICIPOS_GCIAS' ? 'Anticipos Gcias' : i; }
function esFiscal(t){ return t==='DDJJ' || t==='DDJJP'; }
function setTab(t){
  if(t===tab) return;
  tab=t;
  document.getElementById('tab-pend').className='tab'+(t==='PENDIENTE'?' active':'');
  document.getElementById('tab-pag').className='tab'+(t==='PAGADA'?' active':'');
  document.getElementById('tab-ddjj').className='tab'+(t==='DDJJ'?' active':'');
  document.getElementById('tab-ddjjp').className='tab'+(t==='DDJJP'?' active':'');
  document.getElementById('busca').placeholder =
    (t==='DDJJ') ? 'Buscar régimen / empresa…' :
    (t==='DDJJP') ? 'Buscar impuesto / empresa…' : 'Buscar N° / proveedor…';
  document.getElementById('busca').value='';
  document.getElementById('periodo').style.display = esFiscal(t) ? '' : 'none';
  document.getElementById('estadofiltro').style.display = esFiscal(t) ? 'flex' : 'none';
  cargar();
}
function setEstadoFisc(v){
  estadoFisc=v;
  var chips=document.querySelectorAll('#estadofiltro .chip');
  for(var i=0;i<chips.length;i++){ chips[i].className='chip'+(chips[i].getAttribute('data-e')===v?' active':''); }
  render();
}
function llenarPeriodos(){
  var sel=document.getElementById('periodo'); var prev=sel.value, set={};
  ordenes.forEach(function(o){ if(o.periodo) set[o.periodo]=1; });
  var ps=Object.keys(set).sort().reverse();
  sel.innerHTML='<option value="">Todos los períodos</option>'+ps.map(function(p){return '<option value="'+p+'">'+periodoTxt(p)+'</option>';}).join('');
  sel.value=(prev && set[prev])?prev:'';
}
function llenarEmpresas(){
  var sel=document.getElementById('empresa'); var prev=sel.value, set={};
  ordenes.forEach(function(o){ if(o.empresa) set[o.empresa]=1; });
  var emps=Object.keys(set).sort();
  sel.innerHTML='<option value="">Todas</option>'+emps.map(function(e){return '<option>'+e+'</option>';}).join('');
  sel.value = (prev && set[prev]) ? prev : '';
}
function cargar(){
  document.getElementById('lista').innerHTML='<p class="muted">Cargando…</p>';
  var url = (tab==='DDJJ') ? (API+'/ddjj')
          : (tab==='DDJJP') ? (API+'/ddjj-propias')
          : (API+'/ordenes?estado='+tab);
  fetchJSON(url,{headers:{'x-pin':pin()}})
   .then(no401).then(function(r){ return r.json(); })
   .then(function(d){
     if(d && d.error){ throw new Error(d.error); }
     if(tab==='DDJJ'){ ordenes=(d.ddjj||[]).map(function(x){ x._ddjj=true; return x; }); }
     else if(tab==='DDJJP'){ ordenes=(d.ddjj||[]).map(function(x){ x._ddjjp=true; return x; }); }
     else { ordenes=d.ordenes||[]; }
     llenarEmpresas(); if(esFiscal(tab)) llenarPeriodos(); render();
   })
   .catch(function(e){
     if(e==='pin') return;
     var msg = (e && e.message) ? e.message : 'Revisá la conexión.';
     document.getElementById('lista').innerHTML =
       '<div class="err">No se pudo cargar.'+
       '<div class="muted" style="font-size:12px;margin-top:4px">'+msg+'</div>'+
       '<button class="big" style="max-width:220px;margin:16px auto 0" onclick="cargar()">🔄 Reintentar</button>'+
       '</div>';
   });
}
function render(){
  var q=(document.getElementById('busca').value||'').toLowerCase();
  var emp=document.getElementById('empresa').value;
  var per=document.getElementById('periodo').value;
  var cont=document.getElementById('lista'); cont.innerHTML='';
  var esDdjj=(tab==='DDJJ');
  var esP=(tab==='DDJJP');
  var fisc=esDdjj||esP;
  var items=ordenes.filter(function(o){
    if(emp && o.empresa!==emp) return false;
    if(fisc && per && o.periodo!==per) return false;
    if(fisc && estadoFisc==='pend' && o.pagada) return false;
    if(fisc && estadoFisc==='con' && !o.pagada) return false;
    var txt = esDdjj
      ? ((o.regimen||'')+' '+(o.periodo||'')+' '+(o.quincena||'')+' '+(o.empresa||''))
      : esP
      ? (impTxt(o.impuesto)+' '+(o.periodo||'')+' '+(o.empresa||''))
      : ((o.nro_op||'')+' '+(o.proveedor||''));
    return txt.toLowerCase().indexOf(q)>=0;
  });
  if(!items.length){ cont.innerHTML='<p class="muted">'+(fisc?'Sin DDJJ para ese filtro.':'Sin órdenes.')+'</p>'; return; }
  function badgeEstado(pagada){
    return pagada
      ? '<span class="badge" style="background:#14532d;color:#86efac">✓ Comprobante</span>'
      : '<span class="badge" style="background:#3b2f13;color:#fbbf24">📎 Pendiente</span>';
  }
  items.forEach(function(o){
    var d=document.createElement('div'); d.className='card';
    if(esDdjj){
      d.innerHTML='<div class="row"><b>'+(o.regimen||'')+'</b><span>'+badgeEstado(o.pagada)+' <span class="tag">'+(o.quincena||'')+'</span></span></div>'+
        '<div class="prov">'+(o.empresa||'')+'</div>'+
        '<div class="meta">Período '+periodoTxt(o.periodo)+(o.fecha?(' · pago '+o.fecha):'')+'</div>'+
        '<div class="saldo">'+money(o.monto)+'</div>';
    } else if(esP){
      d.innerHTML='<div class="row"><b>'+impTxt(o.impuesto)+'</b>'+badgeEstado(o.pagada)+'</div>'+
        '<div class="prov">'+(o.empresa||'')+'</div>'+
        '<div class="meta">Período '+periodoTxt(o.periodo)+(o.fecha?(' · pago '+o.fecha):'')+'</div>'+
        '<div class="saldo">'+money(o.monto)+'</div>';
    } else {
      var badge=(o.comprobantes>0)?'<span class="badge">📎 '+o.comprobantes+'</span>':'';
      var linea = (tab==='PENDIENTE')
        ? '<div class="saldo">Saldo: '+money(o.saldo)+'</div>'
        : '<div class="saldo">Total: '+money(o.total_a_pagar)+'<span class="tag">'+(o.estado_pago||'')+'</span></div>';
      d.innerHTML='<div class="row"><b>'+(o.nro_op||'')+'</b>'+badge+'</div>'+
        '<div class="prov">'+(o.proveedor||'')+'</div>'+
        '<div class="meta">'+(o.empresa||'')+' · '+(o.fecha||'')+'</div>'+ linea;
    }
    d.onclick=function(){ abrir(o); };
    cont.appendChild(d);
  });
}
function abrir(o){
  sel=o; imgData=null;
  document.getElementById('t-orden').textContent = o._ddjj
    ? ((o.regimen||'')+' '+(o.quincena||'')+' · '+periodoTxt(o.periodo)+' — '+(o.empresa||''))
    : o._ddjjp
    ? (impTxt(o.impuesto)+' · '+periodoTxt(o.periodo)+' — '+(o.empresa||''))
    : ((o.nro_op||'')+' — '+(o.proveedor||''));
  var p=document.getElementById('preview'); p.src=''; p.style.display='none';
  document.getElementById('file').value='';
  document.getElementById('btnsubir').disabled=true;
  document.getElementById('btnsubir').textContent='Subir foto';

  // Qué mostrar: las órdenes siempre dejan ver documentos y subir (comprobantes
  // parciales). Una DDJJ ya pagada solo se ve (no se re-sube); una pendiente
  // solo sube (todavía no hay nada que ver).
  var esFisc = !!(o._ddjj || o._ddjjp);
  var permiteSubir = esFisc ? !o.pagada : true;
  var mostrarDocs  = esFisc ? !!o.pagada : true;
  document.getElementById('subir-wrap').style.display = permiteSubir ? 'block' : 'none';
  document.getElementById('docs-wrap').style.display  = mostrarDocs  ? 'block' : 'none';
  document.getElementById('sep-subir').style.display  = (mostrarDocs && permiteSubir) ? 'block' : 'none';

  show('detalle');
  if(mostrarDocs) cargarDocs(o);
}
function iconoDoc(a){
  if(a.tipo==='op') return '📄';
  if(a.tipo==='cert') return '🧾';
  return a.pdf ? '📄' : '🖼️';
}
function cargarDocs(o){
  var cont=document.getElementById('docs');
  cont.innerHTML='<p class="muted" style="margin-top:0">Cargando documentos…</p>';
  var tipo = o._ddjj ? 'ddjj' : o._ddjjp ? 'ddjjp' : 'orden';
  var qs = 'tipo='+tipo+'&pago_id='+encodeURIComponent(o.pago_id||'');
  if(tipo==='orden'){
    qs += '&empresa='+encodeURIComponent(o.empresa||'')+
          '&nro_op='+encodeURIComponent(o.nro_op||'')+
          '&fecha='+encodeURIComponent(o.fecha||'');
  }
  fetchJSON(API+'/archivos?'+qs,{headers:{'x-pin':pin()}})
   .then(no401).then(function(r){ return r.json(); })
   .then(function(d){
     if(d && d.error){ throw new Error(d.error); }
     var docs=d.archivos||[];
     if(!docs.length){ cont.innerHTML='<p class="muted" style="margin-top:0">No hay documentos guardados.</p>'; return; }
     cont.innerHTML='';
     docs.forEach(function(a){
       var el=document.createElement('div'); el.className='doc';
       el.innerHTML='<span class="ic">'+iconoDoc(a)+'</span><span class="nm">'+(a.nombre||'documento')+'</span><span class="go">→</span>';
       el.onclick=function(){ abrirVisor(a.url, a.nombre, a.pdf); };
       cont.appendChild(el);
     });
   })
   .catch(function(e){
     if(e==='pin') return;
     var msg=(e && e.message)?e.message:'error';
     cont.innerHTML='<p class="err" style="margin-top:0">No se pudieron cargar los documentos.'+
       '<span class="muted" style="display:block;font-size:12px">'+msg+'</span>'+
       '<button class="big" style="max-width:200px;margin:12px auto 0" onclick="cargarDocs(sel)">🔄 Reintentar</button></p>';
   });
}
function abrirVisor(url, nombre, esPdf){
  document.getElementById('v-nombre').textContent = nombre||'';
  document.getElementById('v-abrir').href = url;
  var c=document.getElementById('v-cont'); c.innerHTML='';
  if(esPdf){
    // iOS Safari a veces no embebe PDF en iframe; el link "Abrir en pestaña" es el respaldo.
    var f=document.createElement('iframe'); f.src=url; c.appendChild(f);
  } else {
    var img=document.createElement('img'); img.src=url; c.appendChild(img);
  }
  document.getElementById('visor').style.display='flex';
}
function cerrarVisor(){
  document.getElementById('visor').style.display='none';
  document.getElementById('v-cont').innerHTML='';
}
// Procesar la foto elegida. iPhone (Safari) difiere de Android: manda HEIC, aplica
// orientación EXIF y su canvas a veces devuelve vacío. Por eso se intenta
// redimensionar a JPEG por varios caminos y, si TODO falla, se sube el archivo tal
// cual — nunca se queda en un error mudo con el botón trabado.
function _prevListo(dataUrl){
  imgData=dataUrl;
  var p=document.getElementById('preview'); p.src=dataUrl; p.style.display='block';
  var b=document.getElementById('btnsubir'); b.disabled=false; b.textContent='Subir foto';
}
function _subirCrudo(f){                       // último recurso: el archivo sin tocar
  if(f.size > 9*1024*1024){ toast('❌ La foto es muy pesada; bajá la calidad y reintentá'); return; }
  var rd=new FileReader();
  rd.onload=function(){ _prevListo(rd.result); };
  rd.onerror=function(){ toast('❌ No se pudo leer la foto, probá de nuevo'); };
  rd.readAsDataURL(f);
}
function _redim(src, w0, h0, f){
  try{
    var max=1600, w=w0, h=h0;
    if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(src,0,0,w,h);
    var url=c.toDataURL('image/jpeg',0.7);
    if(!url || url.length<200){ _subirCrudo(f); return; }   // iOS: canvas vino vacío
    _prevListo(url);
  }catch(e){ _subirCrudo(f); }
}
function _viaImg(f){                            // camino clásico <img> (con timeout + onerror)
  var img=new Image(), url=URL.createObjectURL(f);
  var to=setTimeout(function(){ img.onload=img.onerror=null; try{URL.revokeObjectURL(url);}catch(_){}; _subirCrudo(f); }, 8000);
  img.onload=function(){ clearTimeout(to); _redim(img,img.width,img.height,f); try{URL.revokeObjectURL(url);}catch(_){}; };
  img.onerror=function(){ clearTimeout(to); try{URL.revokeObjectURL(url);}catch(_){}; _subirCrudo(f); };
  img.src=url;
}
function procesarFoto(f){
  var b=document.getElementById('btnsubir'); b.disabled=true; b.textContent='Procesando…';
  // createImageBitmap decodifica HEIC en Safari y respeta la orientación; si no
  // está o falla, cae a <img>, y si eso también falla, al archivo crudo.
  if(window.createImageBitmap){
    createImageBitmap(f).then(function(bmp){
      _redim(bmp, bmp.width, bmp.height, f);
      if(bmp.close) bmp.close();
    }).catch(function(){ _viaImg(f); });
  } else { _viaImg(f); }
}
document.getElementById('file').onchange=function(ev){
  var f=ev.target.files && ev.target.files[0]; if(!f) return;
  procesarFoto(f);
};
function subir(){
  if(!sel||!imgData) return;
  var b=document.getElementById('btnsubir'); b.disabled=true; b.textContent='Subiendo…';
  var ep = sel._ddjjp ? '/subir-ddjj-propias' : sel._ddjj ? '/subir-ddjj' : '/subir';
  // 1 reintento y timeout 45s: subir una foto por datos móviles lentos tarda.
  fetchJSON(API+ep,{method:'POST',headers:{'Content-Type':'application/json','x-pin':pin()},
    body:JSON.stringify({pago_id:sel.pago_id, data:imgData.split(',')[1]})}, 1, 45000)
   .then(no401).then(function(r){ return r.json().catch(function(){ return {}; }); })
   .then(function(res){
     if(res && res.error){ throw new Error(res.error); }
     toast('✅ Comprobante subido'); volver(); cargar();
   })
   .catch(function(e){
     if(e==='pin') return;
     b.disabled=false; b.textContent='Subir foto';
     var msg = (e && e.message) ? e.message : 'reintentá';
     toast('❌ ' + msg);
   });
}

if(pin()) cargar(); else mostrarPin(false);
</script>
